<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho principal da página -->
  <header>
    <h1>Boletim Digital</h1>
    <p class="subtitulo">Estudante: Estudante Exemplo | Série: 8º Ano | Turma: 8B | Chamada: 16</p>
  </header>

  <main class="container">
    <!-- Seção de Acesso por PIN -->
    <section id="secao-login" class="card-login">
      <h2>Acesso ao Boletim</h2>
      <form id="form-login">
        <div class="grupo-campo">
          <label for="campo-pin">PIN de Acesso:</label>
          <input type="password" id="campo-pin" placeholder="Digite seu PIN" required autocomplete="off">
        </div>
        <button type="submit" id="btn-entrar" class="btn-principal">Entrar</button>
      </form>
      <p id="msg-login" class="mensagem-status"></p>
    </section>

    <!-- Conteúdo do Boletim (oculto antes do login) -->
    <div id="conteudo-boletim" style="display: none;">
      <!-- Barra de Ações -->
      <section class="barra-acoes">
        <button id="btn-alternar-edicao" class="btn-secundario">Alterar dados</button>
        <button id="btn-salvar" class="btn-principal" style="display: none;">Salvar alterações</button>
        <span id="msg-salvamento" class="mensagem-status"></span>
      </section>

      <!-- Área de cards de resumo -->
      <section class="cards-grid">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="media-geral" class="valor-card">—</p>
        </div>

        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="total-faltas" class="valor-card">—</p>
        </div>

        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="qtd-bom-desempenho" class="valor-card">—</p>
        </div>

        <div class="card">
          <h3>Precisa de Atenção</h3>
          <p id="qtd-atencao" class="valor-card">—</p>
        </div>

        <div class="card">
          <h3>Frequência Geral</h3>
          <p id="frequencia-geral" class="valor-card">92%</p>
          <span class="subtexto-card">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela responsiva de disciplinas -->
      <section class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- O JavaScript vai preencher as linhas aqui automaticamente -->
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <!-- Vinculação do arquivo de código JavaScript -->
  <script src="script.js"></script>
</body>
</html>
